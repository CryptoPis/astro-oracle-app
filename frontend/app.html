<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+Georgian:wght@400;500;600&family=Alegreya+Sans:wght@400;500;700&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Sans+Symbols:wght@400;500&display=swap">
<style>
/* Layout: one phone column under a night sky; a fixed tab bar; the home screen opens on a rotating gold astrolabe. */
:root {
  --void: #0d0a24;        /* night sky, taken from the coin artwork */
  --dusk: #19133d;        /* raised surfaces */
  --veil: #2b2360;        /* lines and borders */
  --mist: #c6bfe4;        /* body text */
  --haze: #8d84b8;        /* secondary text */
  --ivory: #f4ecd8;       /* headings, card faces */
  --gold: #e2bd6a;        /* the one accent */
  --gold-deep: #a9813c;
  --amethyst: #8b6cff;    /* smoke tint, used only in effects */
  --danger: #ef9a8a;

  --display: "Cormorant", "Noto Serif Georgian", Georgia, serif;
  --body: "Alegreya Sans", "Noto Sans Georgian", system-ui, sans-serif;
  --glyph: "Noto Sans Symbols", "Segoe UI Symbol", "DejaVu Sans", serif;

  --tab-h: 64px;
  --top-safe: max(env(safe-area-inset-top, 0px), var(--tg-content-safe-area-inset-top, 0px));
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--void); color: var(--mist);
  font: 400 16px/1.55 var(--body);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
.sym { font-family: var(--glyph); font-variant-emoji: text; }

/* ── atmosphere ── */
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.fog { position: fixed; left: -50%; width: 200%; height: 46vh; bottom: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(40% 60% at 25% 80%, rgba(139,108,255,.16), transparent 70%),
    radial-gradient(35% 55% at 70% 90%, rgba(226,189,106,.07), transparent 70%),
    radial-gradient(50% 70% at 50% 100%, rgba(90,70,190,.22), transparent 75%);
  animation: drift 70s ease-in-out infinite alternate; }
.fog.f2 { height: 34vh; opacity: .8; animation-duration: 95s; animation-direction: alternate-reverse;
  background:
    radial-gradient(30% 60% at 60% 85%, rgba(139,108,255,.14), transparent 70%),
    radial-gradient(40% 50% at 15% 95%, rgba(200,190,255,.08), transparent 70%); }
@keyframes drift { from { transform: translateX(-8%); } to { transform: translateX(8%); } }

#app { position: relative; z-index: 1; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(var(--top-safe) + 8px) calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 28px);
  max-width: 520px; margin: 0 auto; }

/* ── top bar ── */
.top { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.brand { display: flex; align-items: center; gap: 9px; margin-right: auto; }
.brand img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px rgba(226,189,106,.45); }
.brand span { font: italic 600 1.3rem/1 var(--display); color: var(--ivory); letter-spacing: .01em; }
.coins { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 6px; border-radius: 99px;
  background: rgba(226,189,106,.09); border: 1px solid rgba(226,189,106,.28); color: var(--ivory);
  font-weight: 700; font-variant-numeric: tabular-nums; font-size: .95rem; }
.coins small { color: var(--gold); font-weight: 500; font-size: .78rem; }
.coin { width: 20px; height: 20px; flex: none; }
.coins.bump { animation: bump .6s ease; }
@keyframes bump { 40% { transform: scale(1.12); box-shadow: 0 0 24px rgba(226,189,106,.5); } }
.demo { font-size: .72rem; color: var(--haze); border: 1px dashed var(--veil); border-radius: 99px; padding: 3px 9px; }

/* ── type ── */
h1, h2, h3 { font-family: var(--display); color: var(--ivory); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 2.1rem; line-height: 1.05; }
h2 { font-size: 1.6rem; line-height: 1.1; }
h3 { font-size: 1.25rem; line-height: 1.2; }
p { margin: 0; }
.muted { color: var(--haze); }
.label { font-size: .82rem; color: var(--gold); letter-spacing: .04em; }
.view { display: grid; gap: 26px; padding-top: 14px; animation: rise .45s ease both; }
@keyframes rise { from { opacity: .4; transform: translateY(8px); } }
.view-head { display: grid; gap: 4px; }
.ornament { display: flex; align-items: center; gap: 12px; color: var(--gold-deep); }
.ornament::before, .ornament::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--veil), transparent); }

/* ── controls ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px;
  border-radius: 14px; border: 0; font-weight: 700; letter-spacing: .01em;
  background: linear-gradient(180deg, #f0d28e, var(--gold) 55%, var(--gold-deep)); color: #22183f;
  box-shadow: 0 6px 24px rgba(226,189,106,.22), inset 0 1px 0 rgba(255,255,255,.45); transition: transform .15s, filter .15s; }
.btn:active { transform: scale(.98); }
.btn[disabled] { filter: grayscale(.7) brightness(.7); cursor: default; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--gold); border: 1px solid rgba(226,189,106,.4); box-shadow: none; }
.btn.wide { width: 100%; }
.seg { display: flex; padding: 4px; gap: 4px; border-radius: 14px; background: rgba(25,19,61,.75); border: 1px solid var(--veil); }
.seg button { flex: 1; min-height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--haze); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--veil); color: var(--ivory); box-shadow: inset 0 0 0 1px rgba(226,189,106,.35); }
.field { width: 100%; border-radius: 14px; border: 1px solid var(--veil); background: rgba(13,10,36,.7); padding: 13px 15px; color: var(--ivory); }
.field::placeholder { color: var(--haze); }
textarea.field { min-height: 132px; resize: vertical; line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: .85rem; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--veil); color: var(--mist); background: rgba(25,19,61,.6); }

/* ── home ── */
.hero { display: grid; justify-items: center; gap: 4px; text-align: center; margin-top: -6px; }
#astrolabe { width: min(100%, 360px); aspect-ratio: 1 / 1; max-width: 100%; display: block; }
.greet { font: italic 500 1.15rem/1.3 var(--display); color: var(--mist); }
.today { font-size: .9rem; color: var(--haze); }
.moon-line { color: var(--gold); font-size: .9rem; }
.energy { display: grid; gap: 14px; }
.quote { font: italic 500 1.75rem/1.22 var(--display); color: var(--ivory); text-wrap: pretty; }
.focus { color: var(--haze); font-size: .92rem; }
.focus b { color: var(--gold); font-weight: 500; }
.affirm { padding-left: 16px; border-left: 2px solid rgba(226,189,106,.5); font-size: 1.05rem; color: var(--mist); }
.lucky { display: flex; gap: 14px; }
.lucky span { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
  font: 600 1.45rem/1 var(--display); color: var(--ivory); font-variant-numeric: lining-nums tabular-nums;
  border: 1px solid rgba(226,189,106,.55); box-shadow: inset 0 0 18px rgba(226,189,106,.12), 0 0 18px rgba(139,108,255,.15); }
.gift { display: grid; gap: 14px; padding: 18px; border-radius: 20px; background: linear-gradient(160deg, rgba(43,35,96,.85), rgba(25,19,61,.85));
  border: 1px solid rgba(226,189,106,.25); }
.gift-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pips { display: flex; gap: 6px; }
.pips i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--gold-deep); }
.pips i.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px rgba(226,189,106,.6); }
.practices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 10px; }
.pr { display: grid; justify-items: center; align-content: start; gap: 5px; background: none; border: 0; padding: 0; text-align: center; color: var(--mist); }
.pr img { width: min(86px, 100%); aspect-ratio: 1 / 1; max-width: 100%; transition: transform .25s, filter .25s; filter: drop-shadow(0 0 14px rgba(139,108,255,.28)); }
.pr:active img { transform: scale(.94); }
.pr span { font-size: .84rem; line-height: 1.2; text-wrap: balance; }
.pr small { font-size: .74rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.pr.soon img { filter: saturate(.45) brightness(.62); }
.pr.soon span { color: var(--haze); }
.pr.soon small { color: var(--haze); }

/* ── zodiac strip ── */
.strip { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 6px 2px 10px; margin-inline: -4px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.sign { flex: none; width: 66px; display: grid; justify-items: center; gap: 6px; border: 0; background: none; padding: 0; scroll-snap-align: center; color: var(--haze); }
.sign .disc { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 1.6rem; color: var(--mist);
  border: 1px solid var(--veil); background: radial-gradient(circle at 50% 35%, #2a2160, var(--dusk)); transition: box-shadow .25s, border-color .25s, color .25s; }
.sign small { font-size: .74rem; line-height: 1.1; text-align: center; }
.sign[aria-pressed="true"] .disc { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 22px rgba(226,189,106,.35); }
.sign[aria-pressed="true"] small { color: var(--ivory); }
.sign .own { font-size: .64rem; color: var(--gold); margin-top: -4px; }

.reading { display: grid; gap: 18px; }
.art { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, var(--void)); }
.art .sign-name { position: absolute; left: 18px; bottom: 14px; z-index: 1; }
.medal { width: 112px; height: 112px; margin: 6px auto 0; border-radius: 50%; display: grid; place-items: center; font-size: 3.4rem; color: var(--gold);
  border: 1px solid rgba(226,189,106,.5); box-shadow: 0 0 50px rgba(139,108,255,.25), inset 0 0 30px rgba(226,189,106,.12);
  background: radial-gradient(circle at 50% 40%, #2c2366, var(--void)); }
.sign-meta { color: var(--haze); font-size: .88rem; }
.areas { display: grid; gap: 18px; }
.area { display: grid; gap: 4px; }
.area-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.area-head b { font: 600 1.1rem var(--display); color: var(--ivory); }
.score { color: var(--gold); letter-spacing: 2px; font-size: .9rem; white-space: nowrap; }
.score .off { color: var(--veil); }
.advice { padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(226,189,106,.3); color: var(--ivory); background: rgba(226,189,106,.05);
  font: italic 500 1.12rem/1.4 var(--display); }

/* ── tarot ── */
.table { position: relative; min-height: 300px; display: grid; place-items: center; }
#smoke { position: absolute; inset: -40px -16px; width: calc(100% + 32px); height: calc(100% + 80px); pointer-events: none; z-index: 3; }
.deck { position: relative; width: 156px; aspect-ratio: 2 / 3; cursor: pointer; }
.deck .card { position: absolute; inset: 0; }
.deck .card:nth-child(1) { transform: rotate(-7deg) translate(-10px, 4px); }
.deck .card:nth-child(2) { transform: rotate(4deg) translate(8px, 2px); }
.deck.shuffle .card:nth-child(1) { animation: sh1 .9s ease; }
.deck.shuffle .card:nth-child(2) { animation: sh2 .9s ease; }
@keyframes sh1 { 35% { transform: rotate(-16deg) translate(-70px, -6px); } 70% { transform: rotate(6deg) translate(20px, 0); } }
@keyframes sh2 { 35% { transform: rotate(14deg) translate(70px, -10px); } 70% { transform: rotate(-6deg) translate(-20px, 0); } }
.spread { display: flex; justify-content: center; gap: 12px; width: 100%; }
.slot { flex: 0 1 180px; min-width: 0; display: grid; gap: 8px; justify-items: center; }
.slot .pos { font-size: .8rem; color: var(--gold); }
.card { width: 100%; aspect-ratio: 2 / 3; perspective: 900px; max-width: 100%; }
.card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 1s cubic-bezier(.2,.7,.2,1); }
.card.flipped .card-inner { transform: rotateY(180deg); }
.card.enter { animation: deal .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes deal { from { transform: translateY(40px) scale(.85); opacity: 0; } }
.back, .face { position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.back { background: var(--dusk); box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(226,189,106,.4); }
.back img, .face img, .back svg, .face svg { width: 100%; height: 100%; display: block; object-fit: cover; }
.face { transform: rotateY(180deg); background: var(--dusk); box-shadow: 0 0 34px rgba(226,189,106,.28), 0 10px 30px rgba(0,0,0,.5); }
.face.rev img, .face.rev svg { transform: rotate(180deg); }
.cards-text { display: grid; gap: 22px; }
.card-read { display: grid; gap: 6px; }
.card-read h3 small { font: 500 .8rem var(--body); color: var(--gold); margin-left: 6px; }
.synth { font: italic 500 1.3rem/1.35 var(--display); color: var(--ivory); }

/* ── dreams ── */
.counter { text-align: right; font-size: .78rem; color: var(--haze); font-variant-numeric: tabular-nums; }
.symbols { display: grid; gap: 14px; }
.symbol { display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
.symbol .sym { color: var(--gold); font-size: 1.1rem; line-height: 1.5; }
.symbol b { font: 600 1.1rem var(--display); color: var(--ivory); display: block; }
.journal { display: grid; }
.entry { border-top: 1px solid var(--veil); }
.entry:last-child { border-bottom: 1px solid var(--veil); }
.entry > button { width: 100%; text-align: left; background: none; border: 0; padding: 14px 2px; display: flex; gap: 12px; align-items: baseline; }
.entry > button b { font: 600 1.1rem var(--display); color: var(--ivory); flex: 1; min-width: 0; }
.entry > button span { font-size: .8rem; color: var(--haze); white-space: nowrap; }
.entry .body { padding: 0 2px 16px; display: grid; gap: 10px; }
.empty { color: var(--haze); font-style: italic; padding: 8px 0; }

/* ── profile ── */
.me { display: grid; justify-items: center; gap: 8px; text-align: center; }
.avatar { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font: 600 2.6rem var(--display); color: var(--gold);
  border: 1px solid rgba(226,189,106,.5); background: radial-gradient(circle at 50% 35%, #33297a, var(--dusk)); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; border-block: 1px solid var(--veil); padding-block: 16px; }
.stats div { display: grid; gap: 2px; }
.stats div + div { border-left: 1px solid var(--veil); }
.stats b { font: 600 1.8rem/1 var(--display); color: var(--ivory); font-variant-numeric: lining-nums tabular-nums; }
.stats span { font-size: .8rem; color: var(--haze); }
.form-row { display: grid; gap: 8px; }
.inline { display: flex; gap: 10px; }
.inline .field { flex: 1; min-width: 0; }
.ledger { width: 100%; border-collapse: collapse; font-size: .92rem; }
.ledger td { padding: 9px 2px; border-bottom: 1px solid var(--veil); }
.ledger td:last-child { text-align: right; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ledger td small { color: var(--haze); }

/* ── loading ── */
.loading { display: grid; justify-items: center; gap: 12px; padding: 28px 0; color: var(--haze); font-style: italic; }
.orb { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f6e2ae, var(--gold) 40%, transparent 72%);
  box-shadow: 0 0 40px rgba(226,189,106,.45), 0 0 80px rgba(139,108,255,.35); animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.82); opacity: .7; } }

/* ── tabs ── */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(13,10,36,.55), rgba(13,10,36,.96) 40%); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid rgba(226,189,106,.14); }
.tabs-in { display: flex; width: 100%; max-width: 520px; }
.tab { flex: 1; display: grid; justify-items: center; gap: 3px; min-height: 52px; padding-top: 6px; border: 0; background: none; color: var(--haze); font-size: .72rem; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--gold); }
.tab[aria-current="page"] svg { filter: drop-shadow(0 0 6px rgba(226,189,106,.6)); }

/* ── toast & sheet ── */
#toast { position: fixed; left: 50%; top: calc(var(--top-safe) + 12px); transform: translate(-50%, -140%); z-index: 20; max-width: min(92vw, 420px);
  padding: 11px 18px; border-radius: 14px; background: rgba(25,19,61,.96); border: 1px solid rgba(226,189,106,.45); color: var(--ivory);
  box-shadow: 0 10px 40px rgba(0,0,0,.5); transition: transform .45s cubic-bezier(.2,.8,.2,1); font-weight: 500; text-align: center; }
#toast.show { transform: translate(-50%, 0); }
#toast.err { border-color: rgba(239,154,138,.55); }
#toast b { color: var(--gold); }
.sheet { position: fixed; inset: 0; z-index: 30; display: grid; align-content: center; justify-items: center; gap: 18px; text-align: center;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: calc(var(--top-safe) + 24px) calc(env(safe-area-inset-bottom, 0px) + 24px);
  background: radial-gradient(80% 60% at 50% 40%, rgba(43,35,96,.97), rgba(13,10,36,.99)); }
.sheet img { width: 132px; height: 132px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 60px rgba(226,189,106,.3); }
.sheet form { display: grid; gap: 12px; width: min(100%, 340px); }
.sheet p { max-width: 32ch; }
.err-text { color: var(--danger); font-size: .88rem; min-height: 1.2em; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="fog" aria-hidden="true"></div>
<div class="fog f2" aria-hidden="true"></div>

<div id="app">
  <header class="top">
    <div class="brand"><img src="static/img/logo.webp" alt=""><span>Astro Oracle</span></div>
    <span class="demo" id="demoPill" hidden data-i18n="demo"></span>
    <div class="coins" id="coins" aria-live="polite">
      <svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><defs><radialGradient id="cg" cx="40%" cy="35%"><stop offset="0" stop-color="#f8e3a8"/><stop offset=".6" stop-color="#e2bd6a"/><stop offset="1" stop-color="#a9813c"/></radialGradient></defs><circle cx="12" cy="12" r="11" fill="url(#cg)"/><circle cx="12" cy="12" r="8.2" fill="none" stroke="#7d5c24" stroke-width=".8"/><path d="M12 6.5l1.4 4.1 4.1 1.4-4.1 1.4L12 17.5l-1.4-4.1L6.5 12l4.1-1.4z" fill="#5b3f12"/></svg>
      <span id="coinVal">–</span><small>$AST</small>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section class="view" id="v-home">
      <div class="hero">
        <canvas id="astrolabe" aria-hidden="true"></canvas>
        <p class="greet" id="greet"></p>
        <p class="today" id="todayLine"></p>
        <p class="moon-line" id="moonLine"></p>
      </div>
      <div class="ornament sym" aria-hidden="true">✦</div>
      <div class="energy">
        <p class="label" data-i18n="energy"></p>
        <p class="quote" id="quote">…</p>
        <p class="focus" id="focus"></p>
        <p class="affirm" id="affirm"></p>
      </div>
      <div class="gift" id="gift">
        <div class="gift-top"><h3 data-i18n="giftTitle"></h3><span class="muted" id="streakText"></span></div>
        <div class="pips" id="pips" aria-hidden="true"></div>
        <button class="btn wide" id="giftBtn"></button>
      </div>
      <div class="energy">
        <h2 data-i18n="practices"></h2>
        <div class="practices" id="practices"></div>
      </div>
      <div class="energy">
        <p class="label" data-i18n="lucky"></p>
        <div class="lucky" id="lucky"></div>
      </div>
    </section>

  const first = location.hash.slice(1) || store.get("astro.view") || "home";
  go(VIEWS[first] ? first : "home");
  if (S.user && S.user.needs_onboarding) showOnboarding();
}
boot();
})();
</script>
